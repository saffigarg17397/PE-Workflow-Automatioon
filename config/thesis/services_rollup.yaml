name: services_rollup
description: >
  Middle-market tech-enabled services platform / add-on. People-first operating
  model: we underwrite recurring or contracted revenue, a fragmented end market
  that supports bolt-ons, and management that stays. Small absolute size is fine
  — diligence cost is the constraint, not enterprise value.

criteria:
  - name: Revenue in target band
    field: latest_revenue
    op: between
    value: [5.0, 50.0]
    weight: 1.0
    target_label: "$5M–$50M"

  - name: EBITDA margin floor
    field: latest_ebitda_margin
    op: gte
    value: 12.0
    weight: 1.5
    target_label: ">=12%"

  - name: Organic growth
    field: revenue_cagr
    op: gte
    value: 5.0
    weight: 1.5
    target_label: ">=5% CAGR"

  - name: Customer concentration ceiling
    field: top_customer_pct
    op: lte
    value: 20.0
    weight: 2.0
    dealbreaker: true
    target_label: "<=20% single customer"

  - name: Top-5 concentration ceiling
    field: top_five_customer_pct
    op: lte
    value: 50.0
    weight: 1.0
    target_label: "<=50% top 5"

  - name: Recurring/contracted revenue
    field: recurring_revenue_pct
    op: gte
    value: 40.0
    weight: 1.5
    target_label: ">=40% recurring"

  - name: Earnings quality
    field: addback_pct_of_ebitda
    op: lte
    value: 20.0
    weight: 2.0
    target_label: "addbacks <=20% of adj. EBITDA"

  - name: Entry multiple
    field: asking_multiple
    op: lte
    value: 8.0
    weight: 1.0
    target_label: "<=8.0x adj. EBITDA"

  - name: Management continuity
    field: management_staying
    op: exists
    weight: 1.0
    target_label: "key managers staying post-close"
